name: ci

# push to main: test -> build image -> smoke-test -> push to GHCR (sha tag)
#               -> write the tag into blogsphere-gitops (that commit IS the deploy)
# Pull requests only run the tests.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: blogsphere-backend
  GITOPS_REPO: blogsphere-gitops
  MANIFEST: apps/backend/deployment.yaml

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: blogSphere }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      REDISHOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B verify

  build-push-deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image path
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Build the image
        run: docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .

      - name: Smoke-test the image (the gate - nothing is pushed if this fails)
        run: |
          docker network create smoke
          docker run -d --network smoke --name pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=blogSphere postgres:16
          docker run -d --network smoke --name redis redis:7
          sleep 8
          docker run -d --network smoke --name app -p 8080:8080 \
            -e PGHOST=pg -e PGUSER=postgres -e PGPASSWORD=postgres \
            -e REDISHOST=redis "$IMAGE:$GITHUB_SHA"
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/v1/categories >/dev/null 2>&1 && ok=1 && break || sleep 2
          done
          [ "${ok:-}" = 1 ] || { docker logs app | tail -80; exit 1; }
          curl -fsS http://localhost:8080/v3/api-docs >/dev/null

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push both tags
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Check out the GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}   # fine-grained PAT, contents: write on the gitops repo
          path: gitops

      - name: Write the new image tag (this IS the deploy)
        working-directory: gitops
        run: |
          sed -i -E "s#(image: )ghcr\.io/.*#\1${IMAGE}:${GITHUB_SHA}#" "$MANIFEST"
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add "$MANIFEST"
          if git diff --cached --quiet; then echo "image tag unchanged"; exit 0; fi
          git commit -m "deploy ${IMAGE_NAME}:${GITHUB_SHA}"
          git pull --rebase && git push
