spring.application.name=BlogSphere-backend

server.port=${PORT:8080}

# DATABASE - POSTGRESQL
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:blogSphere}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:abcd1234}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true


# JWT
jwt.secret=${JWT_SECRET:local-dev-secret-change-this-before-production-256-bits-minimum}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=2592000000


# FILE STORAGE
file.storage-type=${FILE_STORAGE_TYPE:local}
# Used only when FILE_STORAGE_TYPE=local
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
file.max-size=${FILE_MAX_SIZE:5242880}
file.allowed-types=${FILE_ALLOWED_TYPES:image/jpeg,image/png,image/gif,image/webp}


# CLOUDFLARE R2
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
r2.bucket=${R2_BUCKET:blogsphere-images}
r2.public-url=${R2_PUBLIC_URL:}


# DATA SEEDING
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.authors=${SEED_AUTHORS:500}
app.seed.subscribers=${SEED_SUBSCRIBERS:10000}
app.seed.categories=${SEED_CATEGORIES:10}
app.seed.tags=${SEED_TAGS:20}
app.seed.posts-per-author=${SEED_POSTS_PER_AUTHOR:40}


# REDIS
spring.data.redis.host=${REDISHOST:localhost}
spring.data.redis.port=${REDISPORT:6379}
spring.data.redis.username=${REDISUSER:default}
spring.data.redis.password=${REDISPASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms


# CACHE TTL
cache.ttl.posts=300
cache.ttl.categories=600
cache.ttl.tags=600
cache.ttl.default-ttl=120


# ASYNC CONFIGURATION
async.core-pool-size=4
async.max-pool-size=16
async.queue-capacity=200
async.thread-name-prefix=blogcms-async-


# LOGGING
logging.level.org.springframework.security=DEBUG
logging.level.com.example.blogspherebackend=DEBUG
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# spring.jpa.properties.hibernate.generate_statistics=true


# MAILTRAP SMTP
spring.mail.host=${MAILTRAP_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAILTRAP_PORT:2525}
spring.mail.username=${MAILTRAP_USERNAME:}
spring.mail.password=${MAILTRAP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# AI IMAGE GENERATION
ai.image.enable=${AI_IMAGE_ENABLE:false}

# GOOGLE GEMINI AI
spring.ai.openai.api-key=${GEMINI_API_KEY:}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.model=gemini-2.5-flash
spring.ai.openai.chat.temperature=0.7
spring.ai.openai.chat.max-tokens=4096


# SCHEDULER
cleanup.deleted-retention-days=30
cleanup.cron.purge-posts=0 0 2 * * *
cleanup.cron.purge-users=0 30 2 * * *
cleanup.cron.purge-tokens=0 0 * * * *
cleanup.cron.stats=0 0 */6 * * *
cleanup.cron.publish-scheduled-posts=0 * * * * *
# Weekly digest every Monday at 08:00 AM
cleanup.cron.weekly-digest=0 0 8 * * MON
cleanup.weekly-digest.top-posts=10
# Orphan image cleanup every Sunday at 03:00 AM
cleanup.cron.purge-orphan-images=0 0 3 * * SUN
view.dedup.ttl-seconds=86400


# PASSWORD RESET
password-reset.ttl-minutes=30
# ACTUATOR - only health is exposed; liveness/readiness probes for Kubernetes
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
