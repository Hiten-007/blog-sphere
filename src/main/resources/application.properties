# Applicaton Name
spring.application.name=BlogSphere-backend

# Server Port
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/blogSphere
spring.datasource.username=postgres
spring.datasource.password=abcd1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-min-256-bits-for-hmac-sha}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=2592000000

# File Storage Configuration
file.upload-dir=uploads
file.max-size=5242880
file.allowed-types=image/jpeg,image/png,image/gif,image/webp

# Data Seeding (set to true only for development)
app.seed.enabled=true
app.seed.authors=500
app.seed.subscribers=10000
app.seed.categories=10
app.seed.tags=20
app.seed.posts-per-author=40

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.blogspherebackend=DEBUG

#spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE